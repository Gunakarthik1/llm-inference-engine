global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

alerting:
  alertmanagers: []

rule_files: []

scrape_configs:
  - job_name: "llm-engine"
    static_configs:
      - targets: ["engine:8001"]
    metrics_path: /metrics
    scrape_interval: 5s

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
